<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Admin Pizzeria</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --border: #2e2e2e;
      --text: #e8e8e8; --muted: #888; --accent: #e4572e; --accent-h: #c94722;
      --red: #e74c3c; --radius: 12px;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2.5rem 2rem;
      width: 100%; max-width: 380px;
    }
    .login-logo {
      text-align: center; font-size: 2.5rem; margin-bottom: .5rem;
    }
    .login-title {
      text-align: center; font-size: 1.15rem; font-weight: 700;
      margin-bottom: .25rem;
    }
    .login-subtitle {
      text-align: center; font-size: .85rem; color: var(--muted);
      margin-bottom: 2rem;
    }
    .form-group { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
    .form-group label { font-size: .82rem; color: var(--muted); font-weight: 500; }
    .form-group input {
      background: #111; border: 1px solid var(--border); color: var(--text);
      padding: .7rem .9rem; border-radius: 8px; font-size: .95rem; outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .btn-login {
      width: 100%; padding: .8rem; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background .2s; margin-top: .5rem;
    }
    .btn-login:hover { background: var(--accent-h); }
    .error-msg {
      background: #4d1f1f; border: 1px solid #7a2c2c; color: #ff9999;
      border-radius: 8px; padding: .7rem 1rem; font-size: .88rem;
      margin-bottom: 1.25rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">🍕</div>
    <h1 class="login-title">Admin Pizzeria</h1>
    <p class="login-subtitle">Accedi al pannello di gestione</p>

    {% if error %}
      <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="admin" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login">Accedi →</button>
    </form>
  </div>
</body>
</html>
